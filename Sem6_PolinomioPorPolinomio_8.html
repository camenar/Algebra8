<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="description" content="Recurso educativo interactivo: Producto de polinomio por polinomio - Álgebra 8° - I.E. Merceditas Gómez Martínez, Medellín">
<meta property="og:title" content="Álgebra 8° · La Doble Distribución">
<meta property="og:description" content="Multiplicación de binomio por binomio con el modelo de área de cuatro zonas — contextos reales de Medellín">
<meta property="og:type" content="website">
<title>Álgebra 8° · Sem. 6 · La Doble Distribución · I.E. Merceditas Gómez Martínez</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="window._katexReady=true;document.dispatchEvent(new Event('katex-ready'))"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2040;--blue:#1C3A6E;--blue-mid:#2E75B6;
  --green:#2E7D32;--teal:#00695C;--amber:#C47C1A;--red:#7B1818;
  --green-b:#27AE60;--amber-b:#E08C20;--red-b:#9B2020;
  --acc:#1565C0;--acc-b:#1E88E5;--acc-soft:#E3F2FD;
  --cream:#F7F6F2;--warm:#EDECEA;--border:#C0BDB4;
  --text:#1C1C1E;--text2:#3A3A3C;--text3:#6B6B6E;
  --fs-xs:clamp(18px, 1.25vw, 26px);
  --fs-sm:clamp(22px, 1.6vw, 32px);
  --fs-md:clamp(26px, 2vw, 40px);
  --fs-lg:clamp(32px, 2.6vw, 50px);
  --fs-xl:clamp(38px, 3.2vw, 62px);
  --fs-2xl:clamp(48px, 4.2vw, 80px);
  --fs-3xl:clamp(60px, 5.8vw, 105px);
  --gap:clamp(14px, 1.6vw, 22px);
  --pad:clamp(20px, 2.8vw, 40px);
  --line-h:1.55;
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important;
  }
}
.nbtn:focus, #fs-btn:focus, .video-link:focus, button:focus {
  outline: 3px solid var(--amber-b); outline-offset: 2px;
  box-shadow: 0 0 0 6px rgba(224,140,32,0.3);
}
.sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }

html,body{width:100%;height:100%;overflow:hidden;background:#0a101e;
  font-family:'DM Sans',system-ui,sans-serif; font-size:16px; line-height:var(--line-h)}
#deck{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;background:var(--cream)}
.slide.active{opacity:1;pointer-events:all}
.slide.enter-r{animation:inR .32s cubic-bezier(.22,.68,0,1.1) forwards}
.slide.enter-l{animation:inL .32s cubic-bezier(.22,.68,0,1.1) forwards}
@keyframes inR{from{transform:translateX(3.5%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-3.5%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

header.hdr{background:var(--navy);height:clamp(44px,5.2vh,60px);display:flex;align-items:center;
  padding:0 var(--pad);justify-content:space-between;flex-shrink:0}
.hdr-b{font-size:var(--fs-xs);font-weight:500;color:#A8C4E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-badge{background:var(--blue);color:#fff;font-size:var(--fs-xs);font-weight:800;
  padding:6px clamp(12px,1.8vw,22px);border-radius:6px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap;flex-shrink:0;margin-left:14px}

footer.ftr{background:var(--warm);border-top:2px solid var(--border);height:clamp(36px,4vh,48px);
  display:flex;align-items:center;padding:0 var(--pad);justify-content:space-between;flex-shrink:0}
.ftr span{font-size:var(--fs-xs);color:var(--text3);font-weight:500}

main.body {
  flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; scroll-behavior: smooth;
  padding: clamp(16px,2.2vh,28px) var(--pad) clamp(12px,1.5vh,20px);
  display: flex; flex-direction: column; gap: var(--gap);
}
main.body::-webkit-scrollbar { width: 6px; }
main.body::-webkit-scrollbar-track { background: transparent; }
main.body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
main.body::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }

/* ── PORTADA ─────────────────────────────────────────── */
.s-portada{background:var(--acc)}
.portada-inner{width:100%;max-width:1400px;margin:0 auto;
  padding:clamp(36px,6vh,80px) clamp(48px,7vw,100px);
  display:flex;flex-direction:column;gap:clamp(16px,2.8vh,32px)}
.p-ie{font-size:var(--fs-sm);color:rgba(255,255,255,.8);text-align:center;letter-spacing:.05em}
.p-area{font-size:var(--fs-md);font-weight:700;color:rgba(255,255,255,.92);
  text-align:center;letter-spacing:.16em;text-transform:uppercase}
.p-title{font-family:'DM Serif Display',serif;font-size:var(--fs-3xl);
  color:#fff;text-align:center;line-height:1.05;animation:fadeUp .9s .1s both}
.p-sub{font-size:var(--fs-xl);color:rgba(255,255,255,.88);text-align:center;
  font-style:italic;animation:fadeUp .9s .25s both}
.p-divider{height:3px;background:rgba(255,255,255,.25);border-radius:2px; margin:clamp(8px,1.5vh,14px) 0}
.p-card-grid{display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(12px,1.4vw,20px);animation:fadeUp .9s .4s both}
.p-card{background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18);
  border-radius:14px;padding:clamp(18px,2.2vh,30px) clamp(14px,1.8vw,24px);
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.p-card-num{width:clamp(48px,5vw,64px);height:clamp(48px,5vw,64px);border-radius:50%;
  background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-lg);font-weight:700;color:#fff}
.p-card-title{font-size:var(--fs-lg);font-weight:700;color:#fff;line-height:1.15}
.p-card-sub{font-size:var(--fs-sm);color:rgba(255,255,255,.78);font-style:italic;line-height:1.4}
.p-docente{font-size:var(--fs-sm);color:rgba(255,255,255,.7);text-align:right;font-style:italic}

/* ── ELEMENTOS DE SLIDES ─────────────────────────────── */
.title-row{display:flex;align-items:flex-start;gap:16px}
.accent-bar{width:clamp(10px,1vw,14px);border-radius:6px;flex-shrink:0;align-self:stretch;min-height:48px}
.slide-title{font-family:'DM Serif Display',serif;
  font-size:var(--fs-xl);color:var(--navy);line-height:1.08}
.slide-instr{font-size:var(--fs-md);color:var(--text2);font-style:italic;margin-top:6px;line-height:1.4}
.badge{display:inline-flex;align-items:center;font-size:var(--fs-sm);font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:6px 16px;border-radius:6px;margin-bottom:4px}

.activacion-previa{
  background:var(--warm);border-left:5px solid var(--blue-mid);
  border-radius:0 10px 10px 0;padding:clamp(14px,1.6vh,22px) clamp(16px,2vw,28px);
  font-size:var(--fs-md);color:var(--text2);margin-bottom:var(--gap);font-style:italic}
.activacion-previa strong{color:var(--navy);font-style:normal}

.det-box{background:#FFF8ED;border:3px solid var(--amber);border-radius:14px;
  padding:clamp(16px,2vh,24px) clamp(18px,2.2vw,30px);
  display:flex;flex-direction:column;gap:clamp(10px,1.4vh,16px)}
.det-label{font-size:var(--fs-sm);font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber)}
.det-text{font-family:'DM Serif Display',serif;
  font-size:var(--fs-lg);color:var(--text);line-height:1.55;font-style:italic}
.det-q{font-size:var(--fs-xl);font-weight:800;color:var(--navy);line-height:1.35}

/* ── PASO A PASO (YO HAGO) ────────────────────────────── */
.paso-row{display:flex;align-items:center;gap:clamp(12px,1.4vw,20px);
  background:#fff;border:2px solid var(--border);border-radius:12px;
  padding:clamp(12px,1.4vh,20px) clamp(16px,2vw,26px);border-left:6px solid var(--acc);
  opacity:0;transform:translateY(14px);transition:opacity .4s,transform .4s}
.paso-row.vis{opacity:1;transform:none}
.paso-num{width:clamp(32px,3.4vw,48px);height:clamp(32px,3.4vw,48px);border-radius:50%;
  background:var(--acc);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-md);font-weight:800;color:#fff;flex-shrink:0}
.paso-lbl{font-size:var(--fs-sm);font-weight:800;color:var(--acc);
  flex-shrink:0;min-width:clamp(110px,12vw,160px)}
.paso-body{font-size:var(--fs-md);color:var(--text);flex:1;line-height:1.4}
.paso-note{font-size:var(--fs-xs);color:var(--text3);font-style:italic;
  text-align:right;flex-shrink:0}

.result-bar{background:var(--navy);border-radius:12px;
  padding:clamp(14px,1.8vh,24px) clamp(18px,2.2vw,30px);
  display:flex;align-items:center;justify-content:center;gap:20px;
  font-size:var(--fs-2xl);font-weight:800;color:var(--amber-b);text-align:center;
  opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.result-bar.vis{opacity:1;transform:none}

/* ── FORMAL BOX ──────────────────────────────────────── */
.formal-box{background:var(--warm);border:3px solid var(--acc);border-radius:14px;
  padding:clamp(16px,2vh,28px) clamp(18px,2.2vw,32px);
  display:flex;flex-direction:column;gap:clamp(14px,1.8vh,22px);align-items:stretch}
.formal-title{font-size:var(--fs-lg);font-weight:800;color:var(--acc);text-align:center}
.formal-step{background:#fff;border:2px solid var(--border);border-radius:10px;
  padding:clamp(12px,1.4vh,20px) clamp(16px,2vw,24px);
  display:flex;align-items:center;gap:16px;width:100%;
  opacity:0;transition:opacity .4s}
.formal-step.vis{opacity:1}
.formal-step-n{width:clamp(32px,3.4vw,44px);height:clamp(32px,3.4vw,44px);border-radius:50%;
  background:var(--acc);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-md);font-weight:800;color:#fff;flex-shrink:0}
.formal-step-txt{font-size:var(--fs-md);color:var(--text);line-height:1.4}
.conj-box{background:var(--acc-soft);border:3px solid var(--acc);border-radius:12px;
  padding:clamp(12px,1.4vh,20px) clamp(16px,2vw,24px);
  font-size:var(--fs-md);color:var(--acc);font-style:italic;line-height:1.5;
  opacity:0;transition:opacity .4s}
.conj-box.vis{opacity:1}

/* ── MODELO DE ÁREA ──────────────────────────────────── */
.area-layout{display:flex;gap:var(--gap);align-items:flex-start;flex-wrap:wrap}
.area-panel{background:var(--navy);border-radius:14px;
  padding:clamp(16px,2vh,26px) clamp(16px,2vw,26px);
  display:flex;flex-direction:column;gap:clamp(10px,1.2vh,16px);
  flex:0 0 auto;min-width:clamp(260px,26vw,360px)}
.area-title{font-size:var(--fs-xs);font-weight:800;color:#A8C4E8;
  text-transform:uppercase;letter-spacing:.12em;text-align:center}
.rect-model{display:flex;width:100%;border:3px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.rect-part{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(16px,2.4vh,30px) 6px;color:#fff;font-weight:800;font-size:var(--fs-md);
  border-right:2px dashed rgba(255,255,255,.45);gap:6px}
.rect-part:last-child{border-right:none}
.rect-part small{font-size:var(--fs-xs);font-weight:400;font-style:italic;color:rgba(255,255,255,.75)}
.rect-p1{background:#1C3A6E;flex:3}
.rect-p2{background:#1A6B5A;flex:1.66}
.rect-dim{font-size:var(--fs-sm);color:rgba(255,255,255,.85);text-align:center;font-weight:700}
.grid2{display:flex;flex-direction:column;width:100%;border:3px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.grid2-row{display:flex}
.grid2-row + .grid2-row{border-top:2px dashed rgba(255,255,255,.45)}
.grid2-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(14px,2.2vh,26px) 6px;color:#fff;font-weight:800;font-size:var(--fs-md);
  border-right:2px dashed rgba(255,255,255,.45);gap:4px}
.grid2-cell:last-child{border-right:none}
.grid2-cell small{font-size:var(--fs-xs);font-weight:400;font-style:italic;color:rgba(255,255,255,.75)}
.area-legend{font-size:var(--fs-xs);color:rgba(255,255,255,.65);text-align:center;font-style:italic;line-height:1.5}
.proceso-box{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.2vh,16px);min-width:min(100%,320px)}
.area-stack{flex-direction:column;align-items:stretch}
.area-stack .area-panel{align-self:center;width:100%;max-width:min(700px,92%);min-width:0}
.area-stack .proceso-box{width:100%;min-width:0}
.comp-table th .katex{white-space:nowrap}

/* ── TARJETAS HACEMOS / TÚ HACES ─────────────────────── */
.ex-card{background:#fff;border-radius:14px;border:2.5px solid var(--border);
  border-top:6px solid transparent;
  padding:clamp(14px,1.8vh,22px) clamp(14px,1.8vw,22px);
  display:flex;flex-direction:column;gap:clamp(10px,1.2vh,14px);
  opacity:0;transform:translateY(16px);transition:opacity .45s,transform .45s}
.ex-card.vis{opacity:1;transform:none}
.ex-head{display:flex;align-items:center;gap:14px}
.ex-num{width:clamp(32px,3.4vw,48px);height:clamp(32px,3.4vw,48px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:var(--fs-md);color:#fff;flex-shrink:0}
.ex-title{font-size:var(--fs-md);font-weight:800;color:var(--text)}
.ex-ctx{font-size:var(--fs-sm);color:var(--text2);font-style:italic;line-height:1.4}
.ex-task{background:var(--warm);border-radius:10px;
  padding:clamp(12px,1.4vh,18px) clamp(14px,1.8vw,20px);
  font-size:var(--fs-md);font-weight:800;color:var(--navy);text-align:center;
  border:2px solid var(--border)}
.ex-sol{background:var(--acc-soft);border:2px solid var(--acc);border-radius:10px;
  padding:clamp(10px,1.2vh,16px) clamp(12px,1.6vw,18px);
  font-size:var(--fs-sm);color:var(--text);line-height:1.5}
.ex-sol strong{color:var(--acc)}

/* ── TABLA COMPARATIVA ──────────────────────────────── */
.comp-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.comp-table th{background:var(--acc);color:#fff;
  padding:clamp(10px,1.2vh,16px) clamp(12px,1.5vw,20px);text-align:left}
.comp-table td{padding:clamp(10px,1.2vh,15px) clamp(12px,1.5vw,20px);
  border-bottom:2px solid var(--border);color:var(--text);
  vertical-align:top;line-height:1.4}
.comp-table tr:nth-child(even) td{background:#fff}
.comp-table tr:nth-child(odd) td{background:var(--warm)}
.comp-table td:first-child{font-weight:800;color:var(--acc);background:var(--acc-soft)!important}
.comp-table tr.tabla-row{opacity:0;transition:opacity .4s}
.comp-table tr.tabla-row.vis{opacity:1}

/* ── ERROR BOX ───────────────────────────────────────── */
.error-box{background:#FFF0F0;border:3px solid var(--red-b);border-radius:14px;
  padding:clamp(14px,1.8vh,22px) clamp(16px,2vw,26px);
  display:flex;flex-direction:column;gap:clamp(8px,1vh,12px)}
.error-title{font-size:var(--fs-sm);font-weight:800;color:var(--red-b)}
.error-txt{font-size:var(--fs-md);color:var(--text);line-height:1.55}
.error-row{opacity:0;transition:opacity .4s}
.error-row.vis{opacity:1}
.flechas-box{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,20px);
  flex-wrap:wrap;background:#fff;border:2px solid var(--border);border-radius:12px;
  padding:clamp(12px,1.6vh,20px)}
.flecha-chip{background:var(--acc-soft);border:2.5px solid var(--acc);border-radius:10px;
  padding:clamp(8px,1vh,14px) clamp(12px,1.6vw,20px);font-size:var(--fs-md);
  font-weight:800;color:var(--navy);opacity:0;transition:opacity .4s,transform .4s;transform:scale(.9)}
.flecha-chip.vis{opacity:1;transform:none}

/* ── METACOGNICIÓN ───────────────────────────────────── */
.meta-q{background:#E0F2F1;border:3px solid var(--teal);border-radius:14px;
  padding:clamp(14px,1.8vh,24px) clamp(16px,2vw,28px)}
.meta-qlbl{font-size:var(--fs-sm);font-weight:800;color:var(--teal);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.meta-qtxt{font-family:'DM Serif Display',serif;font-size:var(--fs-lg);
  color:var(--text);font-style:italic;line-height:1.5}

.semaforo{display:flex;flex-direction:column;gap:clamp(10px,1.2vh,16px);margin-top:var(--gap)}
.sema-item{display:flex;align-items:flex-start;gap:clamp(14px,1.6vw,22px);
  background:#fff;border:2px solid var(--border);border-radius:12px;
  padding:clamp(12px,1.4vh,18px) clamp(14px,1.8vw,22px);
  opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.sema-item.vis{opacity:1;transform:none}
.sema-circle{width:clamp(36px,4vw,54px);height:clamp(36px,4vw,54px);border-radius:50%;flex-shrink:0}
.sema-txt{font-size:var(--fs-md);color:var(--text);font-weight:600;line-height:1.4}
.sema-sub{display:block;font-size:var(--fs-xs);color:var(--text3);font-weight:400;
  font-style:italic;margin-top:6px}

/* ── RECURSOS AUDIOVISUALES ─────────────────────────── */
.video-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.video-card{background:#fff;border:2.5px solid var(--border);border-radius:14px;
  padding:clamp(14px,1.8vh,22px) clamp(16px,2vw,26px);
  display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--acc)}
.video-lbl{font-size:var(--fs-xs);font-weight:800;color:var(--acc);
  text-transform:uppercase;letter-spacing:.1em}
.video-title{font-size:var(--fs-md);font-weight:700;color:var(--navy);line-height:1.35}
.video-desc{font-size:var(--fs-sm);color:var(--text2);line-height:1.5;font-style:italic}
.video-link{display:inline-flex;align-items:center;gap:8px;
  background:var(--acc);color:#fff;text-decoration:none;
  padding:8px 18px;border-radius:8px;font-size:var(--fs-sm);font-weight:700;
  align-self:flex-start;transition:background .2s}
.video-link:hover{background:var(--acc-b)}

/* ── CAJA MORADA (VARIANTE) ──────────────────────────── */
.var-box{background:#F3E5F5;border:3px solid #4A148C;border-radius:14px;
  padding:clamp(14px,1.8vh,24px) clamp(16px,2vw,28px);
  display:flex;flex-direction:column;gap:clamp(10px,1.2vh,16px)}
.var-title{font-size:var(--fs-sm);font-weight:800;color:#4A148C;
  text-transform:uppercase;letter-spacing:.1em}
.var-txt{font-size:var(--fs-md);color:var(--text);line-height:1.55}
.var-row{opacity:0;transition:opacity .4s}
.var-row.vis{opacity:1}

/* ── BOTONES ─────────────────────────────────────────── */
.btn-exportar{background:var(--blue);color:#fff;border:none;
  padding:10px 22px;border-radius:8px;font-size:var(--fs-sm);
  font-weight:700;cursor:pointer;margin-top:12px;transition:background .2s}
.btn-exportar:hover{background:var(--navy)}

/* ── SOC FML ─────────────────────────────────────────── */
.soc-fml{background:var(--warm);border:3px solid var(--acc);border-radius:14px;
  padding:clamp(16px,2vh,28px) clamp(18px,2.2vw,32px);

<body>

<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="deck"></div>
<button id="fs-btn" title="Pantalla completa (F)" aria-label="Alternar pantalla completa">⛶</button>
<div id="nav" role="navigation" aria-label="Navegación de diapositivas">
  <button class="nbtn" id="bp" aria-label="Diapositiva anterior">&#8592;</button>
  <span id="ncnt" aria-live="polite">1 / 21</span>
  <button class="nbtn" id="bn" aria-label="Siguiente diapositiva">&#8594;</button>
</div>

<div id="hint">Espacio / → avanzar  ·  ← retroceder  ·  F pantalla completa</div>
<div id="feedback" class="feedback-msg" role="status" aria-live="polite"></div>

<script>
function announceToScreenReader(message) {
  const region = document.getElementById('live-region');
  if (region) { region.textContent = ''; setTimeout(() => { region.textContent = message; }, 100); }
}
function showFeedback(message, isError = false) {
  const fb = document.getElementById('feedback');
  if (!fb) return;
  fb.textContent = message;
  fb.className = 'feedback-msg' + (isError ? ' error' : '') + ' show';
  setTimeout(() => { fb.classList.remove('show'); }, 3000);
}
function saveProgress(slideIndex, clicks) {
  try { localStorage.setItem('algebra8_s6_progress_v1', JSON.stringify({ slide: slideIndex, clicks: clicks, timestamp: Date.now() })); }
  catch(e) { console.warn('No se pudo guardar el progreso:', e); }
}
function loadProgress() {
  try {
    const saved = localStorage.getItem('algebra8_s6_progress_v1');
    if (saved) {
      const data = JSON.parse(saved);
      if (Date.now() - data.timestamp < 86400000 && typeof data.slide === 'number' && data.slide >= 0 && data.slide < SLIDES.length) return data;
    }
  } catch(e) {}
  return null;
}

/* ═══════════════════════════════════════════════════════════
   RETO GENERADOR — BINOMIO × BINOMIO (nativo, sin applets)
═══════════════════════════════════════════════════════════ */
function _rndNZ(a, b){ let v=0; while(v===0) v=Math.floor(Math.random()*(b-a+1))+a; return v; }
function _pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function _num(n){ return n<0 ? '('+n+')' : ''+n; }
function _litStr(gx){ if(gx===0) return ''; if(gx===1) return 'x'; return 'x^{'+gx+'}'; }
function _coefStr(c, lit){ if(!lit) return String(c); if(c===1) return lit; if(c===-1) return '-'+lit; return String(c)+lit; }
function _termStr(t){ if(t[0]===0) return '0'; return _coefStr(t[0], _litStr(t[1])); }
function _polyStr(terms){
  const parts = terms.filter(t=>t[0]!==0).map(t=>_coefStr(t[0], _litStr(t[1])));
  if(!parts.length) return '0';
  return parts.map((p,i)=> i===0 ? p : (p.startsWith('-') ? p : '+'+p)).join('');
}
function _binomStr(p, c){ return _coefStr(p,'x') + (c<0 ? '-'+Math.abs(c) : '+'+c); }

function generarRetoB2(){
  const p=_pick([1,1,1,2,3]), q=_pick([1,1,1,2]);
  const a=_rndNZ(-9,9), b=_rndNZ(-9,9);
  const first=[p*q,2], outer=[p*b,1], inner=[a*q,1], last=[a*b,0];
  const mid=[p*b+a*q,1];
  const R=[first,mid,last];
  window._retoB2={
    f1:_binomStr(p,a), f2:_binomStr(q,b),
    pasos:[
      _coefStr(p,'x')+' \\cdot '+_coefStr(q,'x')+' = '+_termStr(first),
      _coefStr(p,'x')+' \\cdot '+_num(b)+' = '+_termStr(outer),
      _num(a)+' \\cdot '+_coefStr(q,'x')+' = '+_termStr(inner),
      _num(a)+' \\cdot '+_num(b)+' = '+_termStr(last)
    ],
    mid:_termStr(mid),
    R:_polyStr(R)
  };
  renderRetoB2(false);
}
function renderRetoB2(mostrar){
  const d=window._retoB2; if(!d) return;
  const disp=document.getElementById('reto-display');
  if(disp){ disp.innerHTML='\\(\\left('+d.f1+'\\right)\\left('+d.f2+'\\right)\\)'; doKatex(disp); }
  const sol=document.getElementById('reto-sol');
  if(sol){
    if(mostrar){
      sol.innerHTML =
        d.pasos.map((p,i)=>'<div class="paso-row vis" style="margin-bottom:8px"><div class="paso-num">'+(i+1)+'</div><div class="paso-body">\\('+p+'\\)</div></div>').join('') +
        '<div class="paso-row vis" style="margin-bottom:8px;border-left-color:var(--teal)"><div class="paso-num" style="background:var(--teal)">∑</div><div class="paso-body">Términos del medio (semejantes): \\('+d.mid+'\\)</div></div>' +
        '<div class="result-bar vis" style="font-size:var(--fs-lg);margin-top:10px">\\(\\left('+d.f1+'\\right)\\left('+d.f2+'\\right) = '+d.R+'\\)</div>';
      doKatex(sol); sol.style.opacity='1';
    } else { sol.innerHTML=''; sol.style.opacity='0'; }
  }
}
function verRetoB2(){ if(!window._retoB2){ showFeedback('Primero genera un reto 🎲', true); return; } renderRetoB2(true); showFeedback('Comparen el desarrollo con lo que escribieron en el cuaderno ✍️'); }

/* ═══════════════════════════════════════════════════════════
   WIDGET INTERACTIVO — Rectángulo (x+a)(x+b) + animación (slide 4)
═══════════════════════════════════════════════════════════ */
function initRectanguloInteractivo(){
  const root=document.querySelector('.slide.active'); if(!root) return;
  const fig=root.querySelector('#cb-fig'); if(!fig) return;
  const regionsG=root.querySelector('#cb-regions'), edgeG=root.querySelector('#cb-edges'), brG=root.querySelector('#cb-brackets');
  const inX=root.querySelector('#cb-x'), inA=root.querySelector('#cb-a'), inB=root.querySelector('#cb-b');
  const valX=root.querySelector('#cb-valX'), valA=root.querySelector('#cb-valA'), valB=root.querySelector('#cb-valB');
  const eqbase=root.querySelector('#cb-eqbase');
  const tX2=root.querySelector('#cb-tX2'), tAx=root.querySelector('#cb-tAx'), tBx=root.querySelector('#cb-tBx'), tAb=root.querySelector('#cb-tAb');
  const finalLine=root.querySelector('#cb-final'), finaltxt=root.querySelector('#cb-finaltxt');
  const expL=root.querySelector('#cb-expL'), numL=root.querySelector('#cb-numL'), expR=root.querySelector('#cb-expR'), numR=root.querySelector('#cb-numR'), verify=root.querySelector('#cb-verify');
  const btnModelar=root.querySelector('#cb-modelar'), btnReveal=root.querySelector('#cb-reveal'), btnReset=root.querySelector('#cb-reset');
  const S=400, OX=44, OY=22, SVGNS='http://www.w3.org/2000/svg';
  const COL={x2:'#1C3A6E', ax:'#1A6B5A', bx:'#8A5A1A', ab:'#6C3483'};
  let revealed={x2:false,ax:false,bx:false,ab:false};
  let st={x:4,a:5,b:3};
  let animating=false, animTok=0;
  function coef(n){ n=Math.round(n); return n===1 ? 'x' : (n+'x'); }
  function mk(tag,attrs){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
  function draw(){
    const x=st.x, a=st.a, b=st.b;
    const lw=S*x/(x+a), rw=S-lw, th=S*x/(x+b), bh=S-th;
    regionsG.innerHTML=''; edgeG.innerHTML=''; brG.innerHTML='';
    const baseOp = animating ? 0.5 : 0.18;
    const defs=[
      {key:'x2', x:OX,    y:OY,    w:lw, h:th, color:COL.x2, label:'x²',    on:revealed.x2},
      {key:'ax', x:OX+lw, y:OY,    w:rw, h:th, color:COL.ax, label:coef(a), on:revealed.ax},
      {key:'bx', x:OX,    y:OY+th, w:lw, h:bh, color:COL.bx, label:coef(b), on:revealed.bx},
      {key:'ab', x:OX+lw, y:OY+th, w:rw, h:bh, color:COL.ab, label:String(Math.round(a)*Math.round(b)), on:revealed.ab}
    ];
    defs.forEach(d=>{
      const g=mk('g',{'class':'cb-region','data-key':d.key});
      const r=mk('rect',{x:d.x,y:d.y,width:Math.max(0,d.w),height:Math.max(0,d.h),fill:d.color,stroke:'#ffffff','stroke-width':3,'fill-opacity':(d.on?0.95:baseOp),rx:3});
      g.appendChild(r);
      if(d.on && d.w>24 && d.h>22){
        const t=mk('text',{x:d.x+d.w/2,y:d.y+d.h/2,'text-anchor':'middle','dominant-baseline':'central',fill:'#ffffff','font-family':'DM Sans, Arial','font-weight':'700','font-size':Math.min(32,Math.max(14,Math.min(d.w,d.h)/2.4))});
        t.innerHTML=d.label.replace('²','<tspan baseline-shift="super" font-size="0.62em">2</tspan>');
        g.appendChild(t);
      }
      g.addEventListener('click',()=>{ if(animating) return; revealed[d.key]=!revealed[d.key]; draw(); sync(); });
      regionsG.appendChild(g);
    });
    addEdge(OX+lw/2, OY-8, 'x', COL.x2, false);
    if(rw>8) addEdge(OX+lw+rw/2, OY-8, String(Math.round(a)), COL.ax, false);
    addEdge(OX-16, OY+th/2, 'x', COL.x2, true);
    if(bh>8) addEdge(OX-16, OY+th+bh/2, String(Math.round(b)), COL.bx, true);
    brBottom(OX, OY+S, S, 'x + '+Math.round(a));
    brRight(OX+S, OY, S, 'x + '+Math.round(b));
  }
  function addEdge(x,y,txt,color,left){ const t=mk('text',{x:x,y:(left?y+6:y),'text-anchor':(left?'end':'middle'),fill:color,'font-family':'DM Sans, Arial','font-weight':'700','font-size':20}); t.textContent=txt; edgeG.appendChild(t); }
  function brBottom(x,y,w,lbl){ const d='M '+x+' '+(y+10)+' q 0 8 8 8 L '+(x+w/2-8)+' '+(y+18)+' q 8 0 8 8 q 0 -8 8 -8 L '+(x+w-8)+' '+(y+18)+' q 8 0 8 -8'; brG.appendChild(mk('path',{d:d,fill:'none',stroke:'#8A90A2','stroke-width':1.5})); const t=mk('text',{x:x+w/2,y:y+42,'text-anchor':'middle',fill:'#6B6B6E','font-family':'DM Sans, Arial','font-weight':'700','font-size':18}); t.textContent=lbl; brG.appendChild(t); }
  function brRight(x,y,h,lbl){ const d='M '+(x+10)+' '+y+' q 8 0 8 8 L '+(x+18)+' '+(y+h/2-8)+' q 0 8 8 8 q -8 0 -8 8 L '+(x+18)+' '+(y+h-8)+' q 0 8 -8 8'; brG.appendChild(mk('path',{d:d,fill:'none',stroke:'#8A90A2','stroke-width':1.5})); const t=mk('text',{x:x+40,y:y+h/2,'text-anchor':'middle',fill:'#6B6B6E','font-family':'DM Sans, Arial','font-weight':'700','font-size':18,transform:'rotate(90 '+(x+40)+' '+(y+h/2)+')'}); t.textContent=lbl; brG.appendChild(t); }
  function sync(){ tX2.classList.toggle('on',revealed.x2); tAx.classList.toggle('on',revealed.ax); tBx.classList.toggle('on',revealed.bx); tAb.classList.toggle('on',revealed.ab); finalLine.classList.toggle('show', revealed.x2&&revealed.ax&&revealed.bx&&revealed.ab); }
  function nums(){
    const x=st.x, a=st.a, b=st.b, left=(x+a)*(x+b), right=x*x + a*x + b*x + a*b;
    valX.textContent=x; valA.textContent=a; valB.textContent=b;
    eqbase.textContent='(x + '+a+')(x + '+b+') =';
    tAx.textContent=coef(a); tBx.textContent=coef(b); tAb.textContent=String(a*b);
    finaltxt.innerHTML='(x + '+a+')(x + '+b+') = x<sup>2</sup> + '+(a+b)+'x + '+(a*b);
    expL.textContent='('+x+' + '+a+')('+x+' + '+b+')'; numL.textContent=left;
    expR.textContent=(x*x)+' + '+(a*x)+' + '+(b*x)+' + '+(a*b); numR.textContent=right;
    verify.classList.toggle('match', left===right);
  }
  function numsPend(){ expL.textContent='—'; numL.textContent='—'; expR.textContent='—'; numR.textContent='—'; verify.classList.remove('match'); }
  function syncFromInputs(){ st.x=+inX.value; st.a=+inA.value; st.b=+inB.value; }
  function cancelAnim(){ animTok++; animating=false; }
  function tween(from,to,dur,tok,onStep,onDone){
    const t0=performance.now();
    function frame(now){ if(tok!==animTok) return; let p=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-p,3); onStep(from+(to-from)*e); if(p<1) requestAnimationFrame(frame); else if(onDone) onDone(); }
    requestAnimationFrame(frame);
  }
  function modelar(){
    cancelAnim(); const my=++animTok;
    inX.value=4; inA.value=5; inB.value=3;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    revealed={x2:false,ax:false,bx:false,ab:false};
    if(reduce){ syncFromInputs(); revealed={x2:true,ax:true,bx:true,ab:true}; draw(); sync(); nums(); return; }
    st.x=4; st.a=0; st.b=0; animating=true; draw(); sync(); numsPend();
    tween(0,5,750,my,(v)=>{ st.a=v; inA.value=Math.round(v); valA.textContent=Math.round(v); draw(); }, ()=>{
      st.a=5; inA.value=5; draw();
      tween(0,3,650,my,(v)=>{ st.b=v; inB.value=Math.round(v); valB.textContent=Math.round(v); draw(); }, ()=>{
        st.b=3; inB.value=3; draw();
        setTimeout(()=>{ if(my!==animTok) return; animating=false; revealed={x2:true,ax:true,bx:true,ab:true}; draw(); sync(); nums(); }, 800);
      });
    });
  }
  ['input','change'].forEach(ev=>{ [inX,inA,inB].forEach(inp=>inp.addEventListener(ev,()=>{ cancelAnim(); syncFromInputs(); draw(); nums(); })); });
  if(btnModelar) btnModelar.addEventListener('click',()=>{ modelar(); btnModelar.blur(); });
  btnReveal.addEventListener('click',()=>{ cancelAnim(); syncFromInputs(); revealed={x2:true,ax:true,bx:true,ab:true}; draw(); sync(); nums(); btnReveal.blur(); });
  btnReset.addEventListener('click',()=>{ cancelAnim(); inX.value=4; inA.value=5; inB.value=3; revealed={x2:false,ax:false,bx:false,ab:false}; syncFromInputs(); draw(); sync(); nums(); btnReset.blur(); });
  syncFromInputs(); draw(); sync(); nums();
}

/* ═══════════════════════════════════════════════════════════
   MOTOR DE PRESENTACIÓN
═══════════════════════════════════════════════════════════ */
let cur=0,clicks=0;
const deck=document.getElementById('deck');
const savedProgress = loadProgress();
if(savedProgress) { cur = savedProgress.slide; clicks = savedProgress.clicks; }

function buildSlide(idx){
  const s=SLIDES[idx];
  const d=document.createElement('div');
  d.className='slide'+(s.cls?' '+s.cls:'');
  d.setAttribute('role','region');
  d.setAttribute('aria-label',`Diapositiva ${idx+1} de ${SLIDES.length}`);
  let h='';
  if(!s.noH){
    const bc=s.badgeColor||'var(--blue)';
    h+=`<header class="hdr"><span class="hdr-b">${s.bread||''}</span>${s.badge?`<span class="hdr-badge" style="background:${bc}">${s.badge}</span>`:''}</header>`;
  }
  h+=`<main class="body">${s.html}</main>`;
  if(!s.noF) h+=`<footer class="ftr"><span>${s.fL||''}</span><span>I.E. Merceditas Gómez Martínez · Álgebra 8°</span></footer>`;
  d.innerHTML=h; return d;
}

function show(idx,dir){
  const prev=deck.querySelector('.slide.active');
  if(prev){prev.classList.remove('active','enter-r','enter-l');}
  const el=buildSlide(idx); deck.appendChild(el);
  const all=deck.querySelectorAll('.slide'); if(all.length>3) all[0].remove();
  requestAnimationFrame(()=>{
    el.classList.add('active',dir>=0?'enter-r':'enter-l');
    setTimeout(()=>el.classList.remove('enter-r','enter-l'),360);
    doKatex(el); if(SLIDES[idx].onEnter) SLIDES[idx].onEnter();
    const title=el.querySelector('.slide-title');
    if(title) announceToScreenReader(`Diapositiva ${idx+1}: ${title.textContent}`);
    else announceToScreenReader(`Diapositiva ${idx+1} de ${SLIDES.length}`);
    const main=el.querySelector('main.body');
    if(main) main.scrollTop=0;
  });
  clicks=0;
  document.getElementById('ncnt').textContent=`${idx+1} / ${SLIDES.length}`;
  document.getElementById('pbar').style.width=(((idx+1)/SLIDES.length)*100)+'%';
  document.getElementById('pbar').setAttribute('aria-valuenow',idx+1);
  saveProgress(idx,0);
}

function doKatex(el){
  if(window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'\\(',right:'\\)',display:false},
          {left:'\\[',right:'\\]',display:true},
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        throwOnError:false
      });
    }catch(e){ console.warn('KaTeX error:',e); }
  } else {
    document.addEventListener('katex-ready', function onKR(){
      document.removeEventListener('katex-ready', onKR);
      if(window.renderMathInElement){
        try{
          renderMathInElement(el,{
            delimiters:[
              {left:'\\(',right:'\\)',display:false},
              {left:'\\[',right:'\\]',display:true},
              {left:'$$',right:'$$',display:true},
              {left:'$',right:'$',display:false}
            ],
            throwOnError:false
          });
        }catch(e){ console.warn('KaTeX error:',e); }
      }
    });
  }
}

function advance(){
  const s=SLIDES[cur];
  const maxClicks=s.clicks||0;
  if(clicks<maxClicks){
    clicks++;
    if(s.onReveal) s.onReveal(clicks);
    announceToScreenReader(`Paso ${clicks} de ${maxClicks}`);
    saveProgress(cur,clicks);
    return;
  }
  if(cur<SLIDES.length-1){ cur++; show(cur,1); }
  else { showFeedback('¡Semana 6 completada! 🎉 La Doble Distribución queda lista para la Semana 7.'); }
}
function retreat(){ if(cur>0){ cur--; show(cur,-1); } }

document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(['Space','ArrowRight','ArrowLeft'].includes(e.code)) e.preventDefault();
  if(e.code==='Space'||e.code==='ArrowRight') advance();
  if(e.code==='ArrowLeft') retreat();
  if(e.code==='KeyF') document.getElementById('fs-btn')?.click();
});

const btnNext=document.getElementById('bn');
const btnPrev=document.getElementById('bp');
if(btnNext) btnNext.addEventListener('click',advance);
if(btnPrev) btnPrev.addEventListener('click',retreat);

let tx=0;
document.addEventListener('touchstart',e=>{if(e.touches?.[0]) tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const touch=e.changedTouches?.[0]; if(!touch) return;
  const dx=touch.clientX-tx;
  if(Math.abs(dx)>50){dx<0?advance():retreat();}
});

const fsBtn=document.getElementById('fs-btn');
if(fsBtn){
  fsBtn.addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(err){showFeedback('Pantalla completa no disponible en este dispositivo',true);}
  });
  document.addEventListener('fullscreenchange',()=>{
    if(fsBtn) fsBtn.textContent=document.fullscreenElement?'✕':'⛶';
    fsBtn?.setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Entrar en pantalla completa');
  });
}

function iniciar() {
  try {
    const idx = (savedProgress && savedProgress.slide < SLIDES.length) ? savedProgress.slide : 0;
    show(idx, 1);
  } catch(e) {
    console.error('Error al iniciar presentación:', e);
    try { show(0, 1); } catch(e2) { console.error('Error crítico:', e2); }
  }
}

setTimeout(()=>{const hint=document.getElementById('hint');if(hint)hint.style.opacity='0';},5000);
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', iniciar);
} else {
  iniciar();
}
window.addEventListener('beforeunload',()=>{const saved=loadProgress();if(saved&&Date.now()-saved.timestamp>86400000) localStorage.removeItem('algebra8_s6_progress_v1');});
</script>
